# Media stack: Sonarr, Radarr, Plex Media Server, NZBGet
# Start everything: docker compose up -d
#
# Copy .env.example to .env and adjust paths/ports/PUID/PGID/TZ as needed.
# Defaults work from the repo root with local ./config, ./media, and ./downloads.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${TV_DIR:-./media/tv}:/tv
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${MOVIES_DIR:-./media/movies}:/movies
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
      # Optional: set once on first claim, then remove or leave empty
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${CONFIG_DIR:-./config}/plex:/config
      - ${TV_DIR:-./media/tv}:/tv
      - ${MOVIES_DIR:-./media/movies}:/movies
      # Optional transcode scratch; defaults beside other config
      - ${PLEX_TRANSCODE_DIR:-./config/plex-transcode}:/transcode
    ports:
      - "${PLEX_PORT:-32400}:32400/tcp"
      # Discovery / companion ports (helpful on bridged networks)
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    # For LAN discovery and remote access, host networking is often simpler
    # on Linux. To try it: comment out `ports:` above and uncomment below.
    # network_mode: host
    restart: unless-stopped

  nzbget:
    # linuxserver docs: Web UI at http://host:6789/ (root). NZBGet also
    # serves the same UI under /nzbget/ (useful behind a reverse proxy).
    # There is no WEB_ROOT env var on this image.
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - NZBGET_USER=${NZBGET_USER:-nzbget}
      - NZBGET_PASS=${NZBGET_PASS:-tegbzn6789}
    volumes:
      - ${CONFIG_DIR:-./config}/nzbget:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "${NZBGET_PORT:-6789}:6789"
    healthcheck:
      # Root / is the primary UI. /nzbget/ is a built-in alias (trailing slash).
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:6789/ >/dev/null || curl -fsS http://127.0.0.1:6789/nzbget/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
