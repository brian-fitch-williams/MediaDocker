version: "2"
# Media stack: Sonarr, Radarr, Plex Media Server, NZBGet
# Start everything: docker compose up -d
#
# Copy .env.example to .env and adjust paths/ports/PUID/PGID/TZ as needed.
# Defaults work from the repo root with local ./config, ./media, and ./downloads.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${TV_DIR}:/tv
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__SERVER__HOSTOPTIONS__ALLOWEDHOSTS=*
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MOVIES_DIR}:/movies
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      # Optional: set once on first claim, then remove or leave empty
      - PLEX_CLAIM=${PLEX_CLAIM}
    devices:
      # Intel UHD 630 (PCI 00:02.0) only. The GT 730 is a worse transcoder.
      # Long form is required because the PCI path contains colons.
      - source: /dev/dri/by-path/pci-0000:00:02.0-card
        target: /dev/dri/card0
        permissions: rwm
      - source: /dev/dri/by-path/pci-0000:00:02.0-render
        target: /dev/dri/renderD128
        permissions: rwm
    group_add:
      - "44"   # video
      - "992"  # render
    volumes:
      - ${CONFIG_DIR}/plex:/config
      - ${TV_DIR}:/tv
      - ${MOVIES_DIR}:/movies
      # Optional transcode scratch; defaults beside other config
      - ${PLEX_TRANSCODE_DIR}:/transcode
      # Tenagra USB, mounted on the host at the path stored in the Plex library
      - /disks/media3:/disks/media3
    ports:
      - "${PLEX_PORT}:32400/tcp"
      # Discovery / companion ports (helpful on bridged networks)
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    # For LAN discovery and remote access, host networking is often simpler
    # on Linux. To try it: comment out `ports:` above and uncomment below.
    # network_mode: host
    restart: unless-stopped

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NZBGET_USER=${NZBGET_USER}
      - NZBGET_PASS=${NZBGET_PASS}
    volumes:
      - ${CONFIG_DIR}/nzbget:/config
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "${NZBGET_PORT}:6789"
    restart: unless-stopped
